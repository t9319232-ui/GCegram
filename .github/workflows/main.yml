
name: Build GCegram APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'GCegram-Android-v4-gift-shop.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project
        run: |
          mkdir project
          unzip -q GCegram-Android-v4-gift-shop.zip -d project

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android
        uses: android-actions/setup-android@v4
        with:
          packages: ''
        
      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find project -name package.json -print -quit)")
          cd "$PROJECT_DIR"
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm run build
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: GCegram-APK
          path: project/**/android/app/build/outputs/apk/debug/app-debug.apk
          
